# FieldCompliance API — nginx reverse proxy
#
# Place at: /etc/nginx/sites-available/fc-api
# Symlink:   ln -s /etc/nginx/sites-available/fc-api /etc/nginx/sites-enabled/
# Test:      nginx -t
# Reload:    systemctl reload nginx
#
# certbot --nginx will rewrite the server block to add SSL.

server {
    listen 80;
    listen [::]:80;
    server_name fc-api.example.com;  # CHANGE ME

    # Health check bypasses rate limits (used by uptime monitors)
    location = /api/v1/health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        access_log off;
    }

    # Everything else proxies to the NestJS process
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Reasonable timeouts for calculation-heavy endpoints
        proxy_read_timeout 60s;
        proxy_connect_timeout 30s;

        # Upload cap — currently unused but future proofs against Prisma
        # attachment inserts and large CSV imports
        client_max_body_size 25M;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
